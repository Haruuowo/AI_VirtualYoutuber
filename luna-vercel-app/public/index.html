<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luna AI · PictoChat Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1c1f26;
      --surface: #242933;
      --card: #2c3240;
      --border: #475063;
      --accent: #818cf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { font-size: 16px; font-weight: 800; color: var(--accent); }
    .badge { font-size: 11px; font-weight: 700; background: #3b4252; padding: 3px 8px; border-radius: 4px; color: var(--muted); }
    .chat-container {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: radial-gradient(#2d3340 1px, transparent 1px) 0 0/20px 20px, var(--bg);
    }
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      border: 1px solid var(--border);
      animation: popIn 0.2s ease;
    }
    .message.user {
      align-self: flex-end;
      background: #3b4252;
      color: #eceff4;
    }
    .message.luna {
      align-self: flex-start;
      background: var(--card);
      border-left: 3px solid var(--accent);
    }
    .message .sender { font-weight: 800; font-size: 11px; margin-bottom: 3px; color: var(--accent); }
    .footer-bar {
      padding: 12px 16px;
      background: var(--surface);
      border-top: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chips { display: flex; gap: 6px; overflow-x: auto; }
    .chip {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .chip:hover { background: #3b4252; }
    form { display: flex; gap: 8px; }
    input {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button.send {
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 0 20px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }
    button.send:hover { opacity: 0.9; }
    @keyframes popIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">★ LUNA AI · PICTOCHAT ★</div>
    <div class="badge">Vercel Serverless</div>
  </header>

  <div class="chat-container" id="chat">
    <div class="message luna">
      <div class="sender">Luna</div>
      hey! good to see you. what are we getting into today?
    </div>
  </div>

  <div class="footer-bar">
    <div class="chips">
      <div class="chip" onclick="quickSend('Who made you?')">Who made you?</div>
      <div class="chip" onclick="quickSend('What can you do?')">What can you do?</div>
      <div class="chip" onclick="quickSend('Tell me a streamer thought')">Streamer thought</div>
    </div>
    <form id="chatForm">
      <input id="inputMsg" placeholder="Say something to Luna..." autocomplete="off" />
      <button class="send" type="submit">Send</button>
    </form>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('chatForm');
    const input = document.getElementById('inputMsg');
    const history = [];

    function addMessage(sender, text, isUser) {
      const msg = document.createElement('div');
      msg.className = `message ${isUser ? 'user' : 'luna'}`;
      msg.innerHTML = `<div class="sender">${sender}</div>${text}`;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    async function send(text) {
      if (!text.trim()) return;
      addMessage('You', text, true);
      history.push({ role: 'user', content: text });

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history })
        });
        const data = await res.json();
        const reply = data.reply || data.error || "Hmm, brain lag.";
        addMessage('Luna', reply, false);
        history.push({ role: 'assistant', content: reply });
      } catch (err) {
        addMessage('Luna', 'Connection error to Vercel API.', false);
      }
    }

    form.onsubmit = (e) => {
      e.preventDefault();
      const text = input.value;
      input.value = '';
      send(text);
    };

    function quickSend(txt) { send(txt); }
  </script>
</body>
</html>
